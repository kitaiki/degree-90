<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenLayers Polygon (TypeScript)</title>
  </head>
  <body>
    <div class="controls" aria-label="Angle adjustment controls">
      <label for="minAngle">각도 범위</label>
      <input id="minAngle" type="number" step="0.1" value="75" min="0" max="360" />
      <span>~</span>
      <input id="maxAngle" type="number" step="0.1" value="100" min="0" max="360" />
      <button id="adjustAnglesBtn" type="button">각도조정</button>
      <p id="adjustStatus" role="status" aria-live="polite"></p>
    </div>
    <div id="map" aria-label="OpenLayers map canvas"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
